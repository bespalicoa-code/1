<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ff4f81">
<title>NoiDoi ❤️</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f6fa;
    color:#222;
    transition:.3s;
}
button,input,textarea{
    font-family:inherit;
}
button{
    cursor:pointer;
    border:0;
}
.hidden{
    display:none!important;
}
/* ================= LOGIN ================= */
#loginScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#ffdce8,transparent 40%),
        linear-gradient(135deg,#fff,#f3edff);
}
.loginBox{
    width:400px;
    max-width:100%;
    padding:35px;
    background:white;
    border-radius:28px;
    text-align:center;
    box-shadow:
        0 25px 70px rgba(0,0,0,.12);
}
.logo{
    width:80px;
    height:80px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff4f81,#ff7ca1);
    color:white;
    border-radius:25px;
    font-size:42px;
    box-shadow:0 12px 30px rgba(255,79,129,.35);
}
.loginBox h1{
    margin-top:20px;
    font-size:32px;
}
.loginBox p{
    color:#888;
    margin:8px 0 25px;
}
.loginBox input{
    width:100%;
    padding:14px 16px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:14px;
    outline:none;
    font-size:15px;
}
.loginBox input:focus{
    border-color:#ff4f81;
}
.mainButton{
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:14px;
    background:#ff4f81;
    color:white;
    font-weight:bold;
    font-size:15px;
}
.secondaryButton{
    width:100%;
    padding:13px;
    margin-top:8px;
    border-radius:14px;
    background:white;
    color:#ff4f81;
    border:1px solid #ffb3c7;
}
#error{
    color:#e53935;
    margin-top:12px;
    min-height:20px;
}
/* ================= APP ================= */
#app{
    height:100vh;
    display:flex;
}
/* ================= SIDEBAR ================= */
.sidebar{
    width:270px;
    background:white;
    border-right:1px solid #eee;
    padding:22px;
    display:flex;
    flex-direction:column;
}
.logoSmall{
    font-size:23px;
    font-weight:bold;
    margin-bottom:28px;
}
.logoSmall span{
    color:#ff4f81;
}
.profile{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    background:#fafafa;
    border-radius:16px;
    margin-bottom:22px;
}
.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ffe2eb;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ff4f81;
    font-size:20px;
}
.profile small{
    display:block;
    color:#37a65a;
    margin-top:3px;
}
.menu{
    width:100%;
    padding:14px;
    margin:3px 0;
    border-radius:13px;
    background:transparent;
    text-align:left;
    font-size:14px;
}
.menu:hover,
.menu.active{
    background:#ffe5ed;
    color:#e52e65;
    font-weight:bold;
}
.bottom{
    margin-top:auto;
}
.bottom button{
    width:100%;
    padding:13px;
    margin-top:7px;
    border-radius:12px;
    background:#f4f4f6;
}
/* ================= MAIN ================= */
.main{
    flex:1;
    min-width:0;
}
.page{
    height:100%;
    display:flex;
    flex-direction:column;
}
.header{
    height:75px;
    background:white;
    border-bottom:1px solid #eee;
    padding:15px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.header h2{
    font-size:20px;
}
.header small{
    color:#888;
}
.header button{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#f4f4f6;
    font-size:18px;
}
/* ================= CHAT ================= */
.messages{
    flex:1;
    overflow-y:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.empty{
    margin:auto;
    color:#999;
    text-align:center;
}
.message{
    max-width:70%;
    padding:12px 15px;
    border-radius:18px;
    background:white;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
    align-self:flex-start;
    word-wrap:break-word;
}
.message.me{
    align-self:flex-end;
    background:#ff4f81;
    color:white;
}
.message img{
    max-width:260px;
    border-radius:12px;
    display:block;
    margin-bottom:6px;
}
.message audio{
    max-width:250px;
}
.time{
    font-size:10px;
    opacity:.6;
    margin-top:6px;
}
.reaction{
    cursor:pointer;
    margin-top:5px;
    font-size:14px;
}
.typing{
    height:22px;
    padding-left:25px;
    color:#888;
    font-size:12px;
}
.composer{
    display:flex;
    gap:7px;
    padding:15px;
    background:white;
    border-top:1px solid #eee;
}
.composer input{
    flex:1;
    min-width:0;
    border:1px solid #ddd;
    border-radius:14px;
    padding:13px;
    outline:none;
}
.composer button,
.attach{
    padding:11px 14px;
    border-radius:12px;
    background:#f3f3f5;
    cursor:pointer;
}
.send{
    background:#ff4f81!important;
    color:white;
}
/* ================= CONTENT ================= */
.content{
    padding:25px;
    overflow-y:auto;
}
.card{
    background:white;
    padding:22px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
    margin-bottom:20px;
}
.card input,
.card textarea{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
}
.card textarea{
    min-height:100px;
    resize:vertical;
}
.card button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border-radius:12px;
    background:#ff4f81;
    color:white;
    font-weight:bold;
}
/* ================= MEMORIES ================= */
.memoryGrid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}
.memory{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}
.memory img{
    width:100%;
    height:180px;
    object-fit:cover;
}
.memoryText{
    padding:15px;
}
.memoryText h3{
    margin-bottom:7px;
}
.memoryText p{
    color:#777;
}
/* ================= EVENTS ================= */
.event{
    background:white;
    padding:17px;
    margin-bottom:10px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}
.event span{
    color:#ff4f81;
    font-weight:bold;
}
/* ================= TOAST ================= */
#toast{
    position:fixed;
    bottom:25px;
    right:25px;
    background:#222;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    opacity:0;
    transform:translateY(10px);
    transition:.3s;
    pointer-events:none;
}
#toast.show{
    opacity:1;
    transform:translateY(0);
}
/* ================= DARK MODE ================= */
body.dark{
    background:#111217;
    color:#eee;
}
body.dark .sidebar,
body.dark .header,
body.dark .composer,
body.dark .loginBox,
body.dark .card,
body.dark .message,
body.dark .memory,
body.dark .event{
    background:#1b1c22;
    color:#eee;
}
body.dark .profile,
body.dark .menu.active{
    background:#29212a;
}
body.dark input,
body.dark textarea{
    background:#24252c;
    color:white;
    border-color:#444;
}
body.dark .header{
    border-color:#333;
}
body.dark .sidebar{
    border-color:#333;
}
/* ================= MOBILE ================= */
@media(max-width:700px){
    .sidebar{
        width:70px;
        padding:10px;
    }
    .logoSmall{
        font-size:0;
        text-align:center;
    }
    .logoSmall span{
        font-size:25px;
    }
    .profile{
        justify-content:center;
        padding:7px;
    }
    .profile div:last-child{
        display:none;
    }
    .menu{
        font-size:0;
        text-align:center;
    }
    .menu:first-letter{
        font-size:20px;
    }
    .bottom button{
        font-size:0;
    }
    .message{
        max-width:85%;
    }
    .header{
        padding:12px 15px;
    }
    .messages{
        padding:15px;
    }
    .content{
        padding:15px;
    }
}
/* ================= PAGE SWITCH ================= */
.hidden{
    display:none!important;
}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="loginScreen">
    <div class="loginBox">
        <div class="logo">
            ❤️
        </div>
        <h1>NoiDoi</h1>
        <p>
            Locul nostru privat
        </p>
        <input
            id="loginName"
            placeholder="Numele tau"
        >
        <input
            id="loginPassword"
            type="password"
            placeholder="Parola"
        >
        <button
            class="mainButton"
            onclick="enterApp()"
        >
            Intră ❤️
        </button>
        <button
            class="secondaryButton"
            onclick="showInfo()"
        >
            Despre aplicație
        </button>
        <div id="error"></div>
    </div>
</div>
<!-- APP -->
<div id="app" class="hidden">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logoSmall">
            ❤️ <span>NoiDoi</span>
        </div>
        <div class="profile">
            <div class="avatar">
                ❤️
            </div>
            <div>
                <b id="currentUser">
                    Tu
                </b>
                <small>
                    ● online
                </small>
            </div>
        </div>
        <button
            class="menu active"
            onclick="openPage('chatPage',this)"
        >
            💬 Chat
        </button>
        <button
            class="menu"
            onclick="openPage('memoryPage',this)"
        >
            📸 Amintirile noastre
        </button>
        <button
            class="menu"
            onclick="openPage('eventPage',this)"
        >
            ❤️ Zile importante
        </button>
        <div class="bottom">
            <button onclick="toggleDark()">
                🌙 Mod întunecat
            </button>
            <button onclick="logout()">
                🚪 Ieșire
            </button>
        </div>
    </aside>
    <!-- MAIN -->
    <main class="main">
        <!-- CHAT -->
        <section
            id="chatPage"
            class="page"
        >
            <header class="header">
                <div>
                    <h2>
                        Tu ❤️ Ea
                    </h2>
                    <small>
                        Conversația noastră
                    </small>
                </div>
                <button
                    onclick="notifications()"
                >
                    🔔
                </button>
            </header>
            <div
                id="messages"
                class="messages"
            >
                <div class="empty">
                    <h2>❤️</h2>
                    <p>
                        Scrie primul mesaj.
                    </p>
                </div>
            </div>
            <div
                id="typing"
                class="typing"
            ></div>
            <form
                class="composer"
                onsubmit="sendMessage(event)"
            >
                <label class="attach">
                    📷
                    <input
                        type="file"
                        id="photoInput"
                        accept="image/*"
                        hidden
                        onchange="sendPhoto()"
                    >
                </label>
                <input
                    id="messageInput"
                    placeholder="Scrie un mesaj..."
                    autocomplete="off"
                    oninput="typing()"
                >
                <button
                    type="button"
                    onclick="startVoice()"
                >
                    🎙️
                </button>
                <button
                    class="send"
                    type="submit"
                >
                    ➤
                </button>
            </form>
        </section>
        <!-- MEMORIES -->
        <section
            id="memoryPage"
            class="page hidden"
        >
            <header class="header">
                <h2>
                    📸 Amintirile noastre
                </h2>
            </header>
            <div class="content">
                <div class="card">
                    <h3>
                        Adaugă o amintire ❤️
                    </h3>
                    <input
                        id="memoryTitle"
                        placeholder="Titlu"
                    >
                    <textarea
                        id="memoryDescription"
                        placeholder="Descriere..."
                    ></textarea>
                    <input
                        type="file"
                        id="memoryPhoto"
                        accept="image/*"
                    >
                    <button onclick="saveMemory()">
                        Salvează ❤️
                    </button>
                </div>
                <div
                    id="memoryGrid"
                    class="memoryGrid"
                ></div>
            </div>
        </section>
        <!-- EVENTS -->
        <section
            id="eventPage"
            class="page hidden"
        >
            <header class="header">
                <h2>
                    ❤️ Zile importante
                </h2>
            </header>
            <div class="content">
                <div class="card">
                    <input
                        id="eventName"
                        placeholder="Ex: Ziua în care ne-am cunoscut"
                    >
                    <input
                        id="eventDate"
                        type="date"
                    >
                    <button onclick="saveEvent()">
                        Adaugă ❤️
                    </button>
                </div>
                <div id="eventList"></div>
            </div>
        </section>
    </main>
</div>
<div id="toast"></div>
<script>
/* ================= DATA ================= */
let messages =
    JSON.parse(
        localStorage.getItem("noiDoiMessages") || "[]"
    );
let memories =
    JSON.parse(
        localStorage.getItem("noiDoiMemories") || "[]"
    );
let events =
    JSON.parse(
        localStorage.getItem("noiDoiEvents") || "[]"
    );
let currentUser =
    localStorage.getItem("noiDoiUser") || "";
/* ================= LOGIN ================= */
function enterApp(){
    const name =
        document
        .getElementById("loginName")
        .value
        .trim();
    const password =
        document
        .getElementById("loginPassword")
        .value;
    if(!name){
        document.getElementById("error").innerText =
            "Scrie numele tau.";
        return;
    }
    if(password.length < 4){
        document.getElementById("error").innerText =
            "Parola trebuie sa aiba cel putin 4 caractere.";
        return;
    }
    currentUser = name;
    localStorage.setItem(
        "noiDoiUser",
        name
    );
    document
        .getElementById("loginScreen")
        .classList.add("hidden");
    document
        .getElementById("app")
        .classList.remove("hidden");
    document
        .getElementById("currentUser")
        .innerText = name;
    renderMessages();
    renderMemories();
    renderEvents();
}
function logout(){
    localStorage.removeItem(
        "noiDoiUser"
    );
    location.reload();
}
function showInfo(){
    alert(
        "NoiDoi ❤️\n\n" +
        "Aplicație privată pentru voi doi.\n\n" +
        "Această versiune salvează datele în browser."
    );
}
/* ================= PAGES ================= */
function openPage(page,button){
    document
        .querySelectorAll(".page")
        .forEach(
            p => p.classList.add("hidden")
        );
    document
        .getElementById(page)
        .classList.remove("hidden");
    document
        .querySelectorAll(".menu")
        .forEach(
            b => b.classList.remove("active")
        );
    button.classList.add("active");
}
/* ================= CHAT ================= */
function sendMessage(event){
    event.preventDefault();
    const input =
        document.getElementById("messageInput");
    const text =
        input.value.trim();
    if(!text)
        return;
    messages.push({
        type:"text",
        text:text,
        user:currentUser,
        date:new Date().toISOString(),
        reaction:""
    });
    saveMessages();
    input.value="";
    renderMessages();
}
function renderMessages(){
    const box =
        document.getElementById("messages");
    if(messages.length === 0){
        box.innerHTML =
        `
        <div class="empty">
            <h2>❤️</h2>
            <p>
                Scrie primul mesaj.
            </p>
        </div>
        `;
        return;
    }
    box.innerHTML="";
    messages.forEach(
        (message,index)=>{
            const element =
                document.createElement("div");
            element.className =
                "message " +
                (
                    message.user === currentUser
                    ? "me"
                    : ""
                );
            let content="";
            if(message.type === "text"){
                content =
                    escapeHTML(
                        message.text
                    );
            }
            if(message.type === "image"){
                content =
                `
                <img
                    src="${message.data}"
                >
                `;
            }
            if(message.type === "voice"){
                content =
                `
                <audio
                    controls
                    src="${message.data}"
                ></audio>
                `;
            }
            element.innerHTML =
            `
            ${content}
            <div class="time">
                ${formatDate(message.date)}
            </div>
            <div
                class="reaction"
                onclick="react(${index})"
            >
                ${message.reaction || "♡"}
            </div>
            `;
            box.appendChild(element);
        }
    );
    box.scrollTop =
        box.scrollHeight;
}
function react(index){
    if(messages[index].reaction === "❤️")
        messages[index].reaction="";
    else
        messages[index].reaction="❤️";
    saveMessages();
    renderMessages();
}
function saveMessages(){
    localStorage.setItem(
        "noiDoiMessages",
        JSON.stringify(messages)
    );
}
/* ================= PHOTO ================= */
function sendPhoto(){
    const file =
        document
        .getElementById("photoInput")
        .files[0];
    if(!file)
        return;
    const reader =
        new FileReader();
    reader.onload=function(e){
        messages.push({
            type:"image",
            data:e.target.result,
            user:currentUser,
            date:new Date().toISOString(),
            reaction:""
        });
        saveMessages();
        renderMessages();
        toast("Fotografia a fost adăugată ❤️");
    };
    reader.readAsDataURL(file);
}
/* ================= VOICE ================= */
let recorder;
let audioChunks=[];
async function startVoice(){
    if(!navigator.mediaDevices){
        toast(
            "Microfonul nu este disponibil."
        );
        return;
    }
    try{
        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:true
            });
        recorder =
            new MediaRecorder(stream);
        audioChunks=[];
        recorder.ondataavailable =
            e => audioChunks.push(e.data);
        recorder.onstop=function(){
            const blob =
                new Blob(
                    audioChunks,
                    {
                        type:"audio/webm"
                    }
                );
            const reader =
                new FileReader();
            reader.onload=function(){
                messages.push({
                    type:"voice",
                    data:reader.result,
                    user:currentUser,
                    date:new Date().toISOString(),
                    reaction:""
                });
                saveMessages();
                renderMessages();
            };
            reader.readAsDataURL(blob);
        };
        recorder.start();
        toast(
            "Înregistrare... apasă OK pentru oprire."
        );
        setTimeout(
            ()=>{
                if(
                    recorder &&
                    recorder.state === "recording"
                )
                    recorder.stop();
            },
            5000
        );
    }
    catch(error){
        toast(
            "Nu am acces la microfon."
        );
    }
}
/* ================= TYPING ================= */
let typingTimer;
function typing(){
    document
        .getElementById("typing")
        .innerText =
            currentUser +
            " scrie...";
    clearTimeout(
        typingTimer
    );
    typingTimer =
        setTimeout(
            ()=>{
                document
                .getElementById("typing")
                .innerText="";
            },
            1200
        );
}
/* ================= MEMORIES ================= */
function saveMemory(){
    const title =
        document
        .getElementById("memoryTitle")
        .value
        .trim();
    const description =
        document
        .getElementById("memoryDescription")
        .value
        .trim();
    const file =
        document
        .getElementById("memoryPhoto")
        .files[0];
    if(!title){
        toast(
            "Scrie un titlu."
        );
        return;
    }
    if(file){
        const reader =
            new FileReader();
        reader.onload=function(e){
            addMemory(
                title,
                description,
                e.target.result
            );
        };
        reader.readAsDataURL(file);
    }
    else{
        addMemory(
            title,
            description,
            ""
        );
    }
}
function addMemory(
    title,
    description,
    image
){
    memories.push({
        title:title,
        description:description,
        image:image,
        date:new Date().toISOString()
    });
    localStorage.setItem(
        "noiDoiMemories",
        JSON.stringify(memories)
    );
    document
        .getElementById("memoryTitle")
        .value="";
    document
        .getElementById("memoryDescription")
        .value="";
    document
        .getElementById("memoryPhoto")
        .value="";
    renderMemories();
    toast(
        "Amintirea a fost salvată ❤️"
    );
}
function renderMemories(){
    const grid =
        document
        .getElementById("memoryGrid");
    grid.innerHTML="";
    memories
    .slice()
    .reverse()
    .forEach(memory=>{
        const div =
            document.createElement("div");
        div.className="memory";
        div.innerHTML =
        `
        ${
            memory.image
            ?
            `<img src="${memory.image}">`
            :
            ""
        }
        <div class="memoryText">
            <h3>
                ${escapeHTML(memory.title)}
            </h3>
            <p>
                ${escapeHTML(
                    memory.description || ""
                )}
            </p>
        </div>
        `;
        grid.appendChild(div);
    });
}
/* ================= EVENTS ================= */
function saveEvent(){
    const name =
        document
        .getElementById("eventName")
        .value
        .trim();
    const date =
        document
        .getElementById("eventDate")
        .value;
    if(!name || !date){
        toast(
            "Completează ambele câmpuri."
        );
        return;
    }
    events.push({
        name:name,
        date:date
    });
    localStorage.setItem(
        "noiDoiEvents",
        JSON.stringify(events)
    );
    document
        .getElementById("eventName")
        .value="";
    document
        .getElementById("eventDate")
        .value="";
    renderEvents();
    toast(
        "Zi importantă adăugată ❤️"
    );
}
function renderEvents(){
    const list =
        document
        .getElementById("eventList");
    list.innerHTML="";
    events
    .slice()
    .sort(
        (a,b)=>
            a.date.localeCompare(b.date)
    )
    .forEach(event=>{
        const div =
            document.createElement("div");
        div.className="event";
        div.innerHTML =
        `
        <strong>
            ❤️ ${escapeHTML(event.name)}
        </strong>
        <span>
            ${event.date}
        </span>
        `;
        list.appendChild(div);
    });
}
/* ================= DARK MODE ================= */
function toggleDark(){
    document
        .body
        .classList
        .toggle("dark");
    localStorage.setItem(
        "noiDoiDark",
        document
        .body
        .classList
        .contains("dark")
    );
}
if(
    localStorage.getItem("noiDoiDark")
    === "true"
){
    document
        .body
        .classList
        .add("dark");
}
/* ================= NOTIFICATIONS ================= */
async function notifications(){
    if(!("Notification" in window)){
        toast(
            "Browserul nu suportă notificări."
        );
        return;
    }
    const permission =
        await Notification.requestPermission();
    if(permission === "granted"){
        new Notification(
            "NoiDoi ❤️",
            {
                body:
                "Notificările sunt activate!"
            }
        );
        toast(
            "Notificările sunt activate ❤️"
        );
    }
    else{
        toast(
            "Notificările nu au fost permise."
        );
    }
}
/* ================= HELPERS ================= */
function formatDate(date){
    return new Date(date)
        .toLocaleString(
            "ro-RO",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}
function escapeHTML(text){
    return String(text)
        .replace(
            /[&<>"']/g,
            function(char){
                return {
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"
                }[char];
            }
        );
}
function toast(text){
    const element =
        document.getElementById("toast");
    element.innerText=text;
    element.classList.add("show");
    setTimeout(
        ()=>{
            element.classList.remove("show");
        },
        2500
    );
}
/* ================= AUTO LOGIN ================= */
if(currentUser){
    document
        .getElementById("loginScreen")
        .classList.add("hidden");
    document
        .getElementById("app")
        .classList.remove("hidden");
    document
        .getElementById("currentUser")
        .innerText =
            currentUser;
    renderMessages();
    renderMemories();
    renderEvents();
}
</script>

<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0f14">
<title>NoiDoi</title>
<style>
/* =========================================================
   RESET
========================================================= */
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
:root{
    --bg:#0b0d11;
    --panel:#11141a;
    --panel2:#171a21;
    --border:#252932;
    --text:#f3f4f6;
    --muted:#8b919d;
    --accent:#e96a91;
    --accent2:#a878ff;
    --bubble:#1a1e26;
    --bubbleMine:#3b2732;
}
body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}
button,
input,
textarea{
    font:inherit;
}
button{
    border:0;
    cursor:pointer;
}
.hidden{
    display:none!important;
}
/* =========================================================
   LOGIN
========================================================= */
#loginScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(233,106,145,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(168,120,255,.10),
            transparent 35%
        ),
        #090b0f;
}
.loginBox{
    width:410px;
    max-width:100%;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );
    border:1px solid var(--border);
    border-radius:24px;
    padding:38px;
    box-shadow:
        0 30px 90px rgba(0,0,0,.45);
    backdrop-filter:blur(20px);
}
.brandMark{
    width:54px;
    height:54px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
    color:white;
    font-weight:800;
    font-size:22px;
    margin-bottom:24px;
}
.loginBox h1{
    font-size:29px;
    letter-spacing:-.8px;
    margin-bottom:7px;
}
.loginBox .subtitle{
    color:var(--muted);
    font-size:14px;
    margin-bottom:27px;
}
.loginBox input{
    width:100%;
    padding:14px 15px;
    margin-bottom:10px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#0d1015;
    color:white;
    outline:none;
    transition:.2s;
}
.loginBox input:focus{
    border-color:#7d5262;
    box-shadow:
        0 0 0 3px rgba(233,106,145,.08);
}
.primary{
    width:100%;
    padding:14px;
    border-radius:12px;
    margin-top:7px;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            #c9577b
        );
    color:white;
    font-weight:700;
    transition:.2s;
}
.primary:hover{
    transform:translateY(-1px);
    filter:brightness(1.07);
}
.loginInfo{
    text-align:center;
    color:#666c77;
    font-size:11px;
    margin-top:18px;
}
/* =========================================================
   APP
========================================================= */
#app{
    height:100vh;
    display:flex;
    overflow:hidden;
}
/* =========================================================
   SIDEBAR
========================================================= */
.sidebar{
    width:270px;
    flex-shrink:0;
    background:#0e1015;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
}
.brand{
    padding:0 10px;
    font-size:20px;
    font-weight:750;
    letter-spacing:-.4px;
    margin-bottom:28px;
}
.brand span{
    color:var(--accent);
}
.user{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px;
    border-radius:13px;
    background:#14171d;
    border:1px solid #20242c;
    margin-bottom:20px;
}
.avatar{
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            #303541,
            #20232b
        );
    color:#d9dce2;
    font-size:14px;
    font-weight:700;
}
.user strong{
    display:block;
    font-size:13px;
}
.user small{
    color:#5fca82;
    font-size:11px;
}
.nav-title{
    color:#535963;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.2px;
    padding:0 10px;
    margin:15px 0 7px;
}
.nav{
    width:100%;
    background:transparent;
    color:#9298a3;
    padding:11px 12px;
    border-radius:10px;
    text-align:left;
    font-size:13px;
    margin:2px 0;
    transition:.2s;
}
.nav:hover{
    background:#15181f;
    color:#dddfe5;
}
.nav.active{
    background:#1b1e26;
    color:#f1f2f5;
    box-shadow:
        inset 3px 0 0 var(--accent);
}
.sidebarBottom{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:5px;
}
.sidebarBottom button{
    background:transparent;
    color:#777d88;
    padding:10px;
    border-radius:10px;
    text-align:left;
    font-size:12px;
}
.sidebarBottom button:hover{
    background:#15181f;
    color:#ddd;
}
/* =========================================================
   MAIN
========================================================= */
.main{
    flex:1;
    min-width:0;
    background:
        radial-gradient(
            circle at 70% 20%,
            rgba(233,106,145,.035),
            transparent 30%
        ),
        var(--bg);
}
.page{
    height:100%;
    display:flex;
    flex-direction:column;
}
/* =========================================================
   TOPBAR
========================================================= */
.topbar{
    height:74px;
    flex-shrink:0;
    padding:0 25px;
    border-bottom:1px solid var(--border);
    background:rgba(11,13,17,.85);
    backdrop-filter:blur(15px);
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.title{
    display:flex;
    align-items:center;
    gap:12px;
}
.titleAvatar{
    width:39px;
    height:39px;
    border-radius:12px;
    background:
        linear-gradient(
            135deg,
            #31252b,
            #201b24
        );
    display:flex;
    align-items:center;
    justify-content:center;
    color:#df7999;
    font-size:15px;
}
.title h2{
    font-size:15px;
    font-weight:650;
    letter-spacing:-.2px;
}
.title p{
    font-size:11px;
    color:#686e79;
    margin-top:2px;
}
.topActions{
    display:flex;
    gap:7px;
}
.topButton{
    width:36px;
    height:36px;
    border-radius:10px;
    background:#14171d;
    border:1px solid #22262e;
    color:#969ca7;
    transition:.2s;
}
.topButton:hover{
    color:white;
    border-color:#363b45;
}
/* =========================================================
   CHAT
========================================================= */
.messages{
    flex:1;
    overflow-y:auto;
    padding:28px 6%;
    display:flex;
    flex-direction:column;
    gap:7px;
}
.messages::-webkit-scrollbar{
    width:5px;
}
.messages::-webkit-scrollbar-thumb{
    background:#292d35;
    border-radius:10px;
}
.empty{
    margin:auto;
    text-align:center;
    color:#555b66;
}
.emptyIcon{
    font-size:27px;
    margin-bottom:10px;
    opacity:.6;
}
.empty p{
    font-size:12px;
}
/* MESSAGE */
.message{
    max-width:min(520px,75%);
    padding:10px 13px;
    border-radius:15px;
    background:var(--bubble);
    border:1px solid #22262f;
    align-self:flex-start;
    animation:
        messageIn .2s ease;
    word-break:break-word;
}
.message.me{
    align-self:flex-end;
    background:var(--bubbleMine);
    border-color:#50313e;
}
.messageText{
    font-size:13px;
    line-height:1.45;
}
.message img{
    max-width:300px;
    border-radius:10px;
    display:block;
    margin-bottom:6px;
}
.message audio{
    width:250px;
    max-width:100%;
}
.messageBottom{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
    margin-top:5px;
}
.time{
    color:#666c76;
    font-size:9px;
}
.message.me .time{
    color:#a98290;
}
.reaction{
    font-size:12px;
    cursor:pointer;
    opacity:.65;
    transition:.15s;
}
.reaction:hover{
    opacity:1;
    transform:scale(1.15);
}
@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:none;
    }
}
/* =========================================================
   TYPING
========================================================= */
.typing{
    height:18px;
    padding-left:6%;
    color:#666c76;
    font-size:10px;
}
/* =========================================================
   COMPOSER
========================================================= */
.composer{
    margin:0 5% 18px;
    padding:7px;
    background:#12151b;
    border:1px solid #272b34;
    border-radius:15px;
    display:flex;
    align-items:center;
    gap:5px;
    box-shadow:
        0 10px 30px rgba(0,0,0,.15);
}
.composer input{
    flex:1;
    min-width:0;
    border:0;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
    font-size:13px;
}
.composer input::placeholder{
    color:#5e646e;
}
.attach,
.voice,
.send{
    width:35px;
    height:35px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:10px;
    background:transparent;
    color:#777d88;
    transition:.2s;
}
.attach:hover,
.voice:hover{
    background:#1c2027;
    color:#ddd;
}
.send{
    background:#e96a91;
    color:white;
    font-size:14px;
}
.send:hover{
    filter:brightness(1.1);
}
/* =========================================================
   OTHER PAGES
========================================================= */
.content{
    padding:30px 6%;
    overflow-y:auto;
}
.card{
    max-width:650px;
    background:#11141a;
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
}
.card h3{
    font-size:15px;
    margin-bottom:16px;
}
.card input,
.card textarea{
    width:100%;
    padding:12px;
    background:#0c0f14;
    color:white;
    border:1px solid #272b34;
    border-radius:10px;
    outline:none;
    margin:4px 0;
}
.card textarea{
    min-height:100px;
    resize:vertical;
}
.card button{
    width:100%;
    padding:12px;
    border-radius:10px;
    background:#e96a91;
    color:white;
    font-weight:650;
    margin-top:7px;
}
/* MEMORIES */
.memoryGrid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(210px,1fr)
        );
    gap:14px;
}
.memory{
    background:#11141a;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}
.memory img{
    width:100%;
    height:170px;
    object-fit:cover;
}
.memoryText{
    padding:14px;
}
.memoryText h3{
    font-size:14px;
    margin-bottom:5px;
}
.memoryText p{
    color:#747a85;
    font-size:12px;
    line-height:1.45;
}
/* EVENTS */
.event{
    max-width:650px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 17px;
    background:#11141a;
    border:1px solid var(--border);
    border-radius:13px;
    margin-bottom:8px;
}
.event strong{
    font-size:13px;
}
.event span{
    color:#df7999;
    font-size:11px;
}
/* =========================================================
   TOAST
========================================================= */
#toast{
    position:fixed;
    right:20px;
    bottom:20px;
    padding:11px 15px;
    background:#20232a;
    border:1px solid #343943;
    color:#e7e9ed;
    border-radius:11px;
    font-size:12px;
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:.25s;
}
#toast.show{
    opacity:1;
    transform:none;
}
/* =========================================================
   MOBILE
========================================================= */
@media(max-width:720px){
    .sidebar{
        width:64px;
        padding:16px 8px;
    }
    .brand{
        text-align:center;
        padding:0;
        font-size:0;
    }
    .brand:first-letter{
        font-size:21px;
    }
    .user{
        justify-content:center;
        padding:7px;
    }
    .user div:last-child{
        display:none;
    }
    .nav{
        text-align:center;
        font-size:0;
        padding:12px 5px;
    }
    .nav::first-letter{
        font-size:18px;
    }
    .sidebarBottom button{
        font-size:0;
        text-align:center;
    }
    .messages{
        padding:20px 13px;
    }
    .message{
        max-width:86%;
    }
    .composer{
        margin:0 10px 10px;
    }
    .content{
        padding:20px 13px;
    }
    .topbar{
        padding:0 14px;
    }
    .title h2{
        font-size:14px;
    }
}
</style>
</head>
<body>
<!-- ======================================================
     LOGIN
====================================================== -->
<div id="loginScreen">
    <div class="loginBox">
        <div class="brandMark">
            ND
        </div>
        <h1>NoiDoi</h1>
        <div class="subtitle">
            Spațiul vostru privat.
        </div>
        <input
            id="loginName"
            type="text"
            placeholder="Numele tău"
        >
        <input
            id="loginPassword"
            type="password"
            placeholder="Parola"
        >
        <button
            class="primary"
            onclick="enterApp()"
        >
            Continuă
        </button>
        <div id="error"></div>
        <div class="loginInfo">
            Datele acestei versiuni sunt salvate local.
        </div>
    </div>
</div>
<!-- ======================================================
     APP
====================================================== -->
<div
    id="app"
    class="hidden"
>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            ND <span>NoiDoi</span>
        </div>
        <div class="user">
            <div class="avatar">
                ND
            </div>
            <div>
                <strong id="currentUser">
                    Utilizator
                </strong>
                <small>
                    ● online
                </small>
            </div>
        </div>
        <div class="nav-title">
            Spațiul nostru
        </div>
        <button
            class="nav active"
            onclick="openPage('chatPage',this)"
        >
            💬 &nbsp; Conversație
        </button>
        <button
            class="nav"
            onclick="openPage('memoryPage',this)"
        >
            📷 &nbsp; Amintiri
        </button>
        <button
            class="nav"
            onclick="openPage('eventPage',this)"
        >
            ♥ &nbsp; Momente importante
        </button>
        <div class="sidebarBottom">
            <button onclick="notifications()">
                🔔 &nbsp; Notificări
            </button>
            <button onclick="logout()">
                ↪ &nbsp; Ieșire
            </button>
        </div>
    </aside>
    <!-- MAIN -->
    <main class="main">
        <!-- CHAT -->
        <section
            id="chatPage"
            class="page"
        >
            <header class="topbar">
                <div class="title">
                    <div class="titleAvatar">
                        ND
                    </div>
                    <div>
                        <h2>
                            NoiDoi
                        </h2>
                        <p>
                            conversația voastră
                        </p>
                    </div>
                </div>
                <div class="topActions">
                    <button
                        class="topButton"
                        onclick="notifications()"
                    >
                        🔔
                    </button>
                </div>
            </header>
            <div
                id="messages"
                class="messages"
            >
            </div>
            <div
                id="typing"
                class="typing"
            ></div>
            <form
                class="composer"
                onsubmit="sendMessage(event)"
            >
                <label class="attach">
                    +
                    <input
                        type="file"
                        id="photoInput"
                        accept="image/*"
                        hidden
                        onchange="sendPhoto()"
                    >
                </label>
                <input
                    id="messageInput"
                    placeholder="Scrie un mesaj..."
                    autocomplete="off"
                    oninput="typing()"
                >
                <button
                    type="button"
                    class="voice"
                    onclick="startVoice()"
                >
                    🎙
                </button>
                <button
                    type="submit"
                    class="send"
                >
                    ↑
                </button>
            </form>
        </section>
        <!-- MEMORIES -->
        <section
            id="memoryPage"
            class="page hidden"
        >
            <header class="topbar">
                <div class="title">
                    <div>
                        <h2>
                            Amintiri
                        </h2>
                        <p>
                            Momentele voastre
                        </p>
                    </div>
                </div>
            </header>
            <div class="content">
                <div class="card">
                    <h3>
                        Adaugă o amintire
                    </h3>
                    <input
                        id="memoryTitle"
                        placeholder="Titlu"
                    >
                    <textarea
                        id="memoryDescription"
                        placeholder="Descriere..."
                    ></textarea>
                    <input
                        type="file"
                        id="memoryPhoto"
                        accept="image/*"
                    >
                    <button onclick="saveMemory()">
                        Salvează
                    </button>
                </div>
                <div
                    id="memoryGrid"
                    class="memoryGrid"
                ></div>
            </div>
        </section>
        <!-- EVENTS -->
        <section
            id="eventPage"
            class="page hidden"
        >
            <header class="topbar">
                <div>
                    <h2>
                        Momente importante
                    </h2>
                    <p>
                        Zile pe care nu vreți să le uitați
                    </p>
                </div>
            </header>
            <div class="content">
                <div class="card">
                    <h3>
                        Adaugă o zi importantă
                    </h3>
                    <input
                        id="eventName"
                        placeholder="Ex. Ziua în care ne-am cunoscut"
                    >
                    <input
                        id="eventDate"
                        type="date"
                    >
                    <button onclick="saveEvent()">
                        Salvează
                    </button>
                </div>
                <div id="eventList"></div>
            </div>
        </section>
    </main>
</div>
<div id="toast"></div>
<script>
/* =========================================================
   LOCAL DATA
========================================================= */
let messages =
    JSON.parse(
        localStorage.getItem("noidoi_messages") || "[]"
    );
let memories =
    JSON.parse(
        localStorage.getItem("noidoi_memories") || "[]"
    );
let events =
    JSON.parse(
        localStorage.getItem("noidoi_events") || "[]"
    );
let currentUser =
    localStorage.getItem("noidoi_user") || "";
/* =========================================================
   LOGIN
========================================================= */
function enterApp(){
    const name =
        document
        .getElementById("loginName")
        .value
        .trim();
    const password =
        document
        .getElementById("loginPassword")
        .value;
    if(name.length < 2){
        document
        .getElementById("error")
        .innerText =
            "Introdu un nume valid.";
        return;
    }
    if(password.length < 4){
        document
        .getElementById("error")
        .innerText =
            "Parola trebuie să aibă cel puțin 4 caractere.";
        return;
    }
    currentUser = name;
    localStorage.setItem(
        "noidoi_user",
        name
    );
    openApplication();
}
function openApplication(){
    document
    .getElementById("loginScreen")
    .classList.add("hidden");
    document
    .getElementById("app")
    .classList.remove("hidden");
    document
    .getElementById("currentUser")
    .innerText =
        currentUser;
    renderMessages();
    renderMemories();
    renderEvents();
}
function logout(){
    localStorage.removeItem(
        "noidoi_user"
    );
    location.reload();
}
/* =========================================================
   NAVIGATION
========================================================= */
function openPage(page,button){
    document
    .querySelectorAll(".page")
    .forEach(
        p =>
        p.classList.add("hidden")
    );
    document
    .getElementById(page)
    .classList.remove("hidden");
    document
    .querySelectorAll(".nav")
    .forEach(
        b =>
        b.classList.remove("active")
    );
    button.classList.add("active");
}
/* =========================================================
   CHAT
========================================================= */
function sendMessage(event){
    event.preventDefault();
    const input =
        document
        .getElementById("messageInput");
    const text =
        input.value.trim();
    if(!text)
        return;
    messages.push({
        type:"text",
        text:text,
        user:currentUser,
        date:new Date().toISOString(),
        reaction:""
    });
    saveMessages();
    input.value="";
    renderMessages();
}
function renderMessages(){
    const box =
        document
        .getElementById("messages");
    box.innerHTML="";
    if(messages.length === 0){
        box.innerHTML =
        `
        <div class="empty">
            <div class="emptyIcon">
                ○
            </div>
            <p>
                Conversația începe aici.
            </p>
        </div>
        `;
        return;
    }
    messages.forEach(
        (message,index)=>{
            const element =
                document.createElement("div");
            element.className =
                "message " +
                (
                    message.user === currentUser
                    ? "me"
                    : ""
                );
            let content="";
            if(message.type==="text"){
                content =
                `
                <div class="messageText">
                    ${escapeHTML(message.text)}
                </div>
                `;
            }
            if(message.type==="image"){
                content =
                `
                <img src="${message.data}">
                `;
            }
            if(message.type==="voice"){
                content =
                `
                <audio
                    controls
                    src="${message.data}"
                ></audio>
                `;
            }
            element.innerHTML =
            `
            ${content}
            <div class="messageBottom">
                <span class="time">
                    ${formatDate(message.date)}
                </span>
                <span
                    class="reaction"
                    onclick="react(${index})"
                >
                    ${message.reaction || "♡"}
                </span>
            </div>
            `;
            box.appendChild(element);
        }
    );
    box.scrollTop =
        box.scrollHeight;
}
function react(index){
    messages[index].reaction =
        messages[index].reaction === "♥"
        ? ""
        : "♥";
    saveMessages();
    renderMessages();
}
function saveMessages(){
    localStorage.setItem(
        "noidoi_messages",
        JSON.stringify(messages)
    );
}
/* =========================================================
   PHOTO
========================================================= */
function sendPhoto(){
    const file =
        document
        .getElementById("photoInput")
        .files[0];
    if(!file)
        return;
    const reader =
        new FileReader();
    reader.onload=function(e){
        messages.push({
            type:"image",
            data:e.target.result,
            user:currentUser,
            date:new Date().toISOString(),
            reaction:""
        });
        saveMessages();
        renderMessages();
        toast("Fotografia adăugată.");
    };
    reader.readAsDataURL(file);
}
/* =========================================================
   VOICE
========================================================= */
let recorder;
let chunks=[];
async function startVoice(){
    try{
        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:true
            });
        recorder =
            new MediaRecorder(stream);
        chunks=[];
        recorder.ondataavailable =
            e =>
            chunks.push(e.data);
        recorder.onstop=function(){
            const blob =
                new Blob(
                    chunks,
                    {
                        type:"audio/webm"
                    }
                );
            const reader =
                new FileReader();
            reader.onload=function(){
                messages.push({
                    type:"voice",
                    data:reader.result,
                    user:currentUser,
                    date:new Date().toISOString(),
                    reaction:""
                });
                saveMessages();
                renderMessages();
                toast("Mesaj vocal adăugat.");
            };
            reader.readAsDataURL(blob);
        };
        recorder.start();
        toast(
            "Înregistrare vocală — 5 secunde."
        );
        setTimeout(
            ()=>{
                if(
                    recorder &&
                    recorder.state === "recording"
                ){
                    recorder.stop();
                    stream
                    .getTracks()
                    .forEach(
                        track =>
                        track.stop()
                    );
                }
            },
            5000
        );
    }
    catch(error){
        toast(
            "Nu pot accesa microfonul."
        );
    }
}
/* =========================================================
   TYPING
========================================================= */
let typingTimer;
function typing(){
    document
    .getElementById("typing")
    .innerText =
        "scrie...";
    clearTimeout(
        typingTimer
    );
    typingTimer =
        setTimeout(
            ()=>{
                document
                .getElementById("typing")
                .innerText="";
            },
            1000
        );
}
/* =========================================================
   MEMORIES
========================================================= */
function saveMemory(){
    const title =
        document
        .getElementById("memoryTitle")
        .value
        .trim();
    const description =
        document
        .getElementById("memoryDescription")
        .value
        .trim();
    const file =
        document
        .getElementById("memoryPhoto")
        .files[0];
    if(!title){
        toast("Introdu un titlu.");
        return;
    }
    if(file){
        const reader =
            new FileReader();
        reader.onload=function(e){
            createMemory(
                title,
                description,
                e.target.result
            );
        };
        reader.readAsDataURL(file);
    }
    else{
        createMemory(
            title,
            description,
            ""
        );
    }
}
function createMemory(
    title,
    description,
    image
){
    memories.push({
        title,
        description,
        image,
        date:new Date().toISOString()
    });
    localStorage.setItem(
        "noidoi_memories",
        JSON.stringify(memories)
    );
    document
    .getElementById("memoryTitle")
    .value="";
    document
    .getElementById("memoryDescription")
    .value="";
    document
    .getElementById("memoryPhoto")
    .value="";
    renderMemories();
    toast("Amintire salvată.");
}
function renderMemories(){
    const grid =
        document
        .getElementById("memoryGrid");
    grid.innerHTML="";
    memories
    .slice()
    .reverse()
    .forEach(
        memory=>{
            const div =
                document.createElement("div");
            div.className="memory";
            div.innerHTML =
            `
            ${
                memory.image
                ?
                `<img src="${memory.image}">`
                :
                ""
            }
            <div class="memoryText">
                <h3>
                    ${escapeHTML(memory.title)}
                </h3>
                <p>
                    ${escapeHTML(
                        memory.description || ""
                    )}
                </p>
            </div>
            `;
            grid.appendChild(div);
        }
    );
}
/* =========================================================
   EVENTS
========================================================= */
function saveEvent(){
    const name =
        document
        .getElementById("eventName")
        .value
        .trim();
    const date =
        document
        .getElementById("eventDate")
        .value;
    if(!name || !date){
        toast("Completează câmpurile.");
        return;
    }
    events.push({
        name,
        date
    });
    localStorage.setItem(
        "noidoi_events",
        JSON.stringify(events)
    );
    document
    .getElementById("eventName")
    .value="";
    document
    .getElementById("eventDate")
    .value="";
    renderEvents();
    toast("Moment adăugat.");
}
function renderEvents(){
    const list =
        document
        .getElementById("eventList");
    list.innerHTML="";
    events
    .slice()
    .sort(
        (a,b)=>
            a.date.localeCompare(b.date)
    )
    .forEach(
        event=>{
            const div =
                document.createElement("div");
            div.className="event";
            div.innerHTML =
            `
            <strong>
                ${escapeHTML(event.name)}
            </strong>
            <span>
                ${event.date}
            </span>
            `;
            list.appendChild(div);
        }
    );
}
/* =========================================================
   NOTIFICATIONS
========================================================= */
async function notifications(){
    if(!("Notification" in window)){
        toast(
            "Notificările nu sunt disponibile."
        );
        return;
    }
    const permission =
        await Notification.requestPermission();
    if(permission==="granted"){
        new Notification(
            "NoiDoi",
            {
                body:
                    "Notificările sunt activate."
            }
        );
        toast(
            "Notificări activate."
        );
    }
}
/* =========================================================
   HELPERS
========================================================= */
function formatDate(date){
    return new Date(date)
        .toLocaleString(
            "ro-RO",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}
function escapeHTML(text){
    return String(text)
    .replace(
        /[&<>"']/g,
        char =>
        ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char])
    );
}
function toast(text){
    const t =
        document.getElementById("toast");
    t.innerText=text;
    t.classList.add("show");
    setTimeout(
        ()=>{
            t.classList.remove("show");
        },
        2500
    );
}
/* =========================================================
   START
========================================================= */
if(currentUser){
    openApplication();
}
